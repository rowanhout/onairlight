; ============================================================================
; PlatformIO-configuratie voor de On-Air Lamp ESP32-firmware
; ============================================================================
;
; Bouwen/uploaden:
;   pio run -e poe2 -t upload          ; Olimex ESP32-POE2 (standaard)
;   pio run -e olimex -t upload        ; Olimex ESP32-POE-ISO
;   pio run -e wt32-eth01 -t upload    ; WT32-ETH01
; Seriele monitor:
;   pio device monitor
;
; LET OP: zet in config.h ook de juiste BOARD-macro, zodat de firmware de
; bijbehorende Ethernet-pinnen en lamp-GPIO gebruikt.
; ----------------------------------------------------------------------------

[platformio]
; Het eerste env is de standaard wanneer je 'pio run' zonder -e draait.
default_envs = poe2

; De sketch (onair-esp32.ino) staat in DEZE map, niet in een src/-map -- dat is
; nodig om de map ook als Arduino IDE-sketch te kunnen openen. Zonder deze regel
; compileert PlatformIO de sketch niet en faalt het linken met
; "undefined reference to `setup()' / `loop()'".
src_dir = .

; Gedeelde instellingen voor alle borden.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Sluit de build-map uit, anders wordt de gegenereerde .ino.cpp een tweede keer
; meegenomen (dubbele symbolen).
build_src_filter = +<*> -<.pio/>
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson@^7

; --- Olimex ESP32-POE2 (standaard) ---
; PlatformIO heeft (nog) geen aparte 'esp32-poe2'-definitie; de POE2 gebruikt
; dezelfde klassieke ESP32 en is hiermee prima te bouwen en te flashen.
[env:poe2]
board = esp32-poe

; --- Olimex ESP32-POE2, met logging van de WebSocket-library ---
; Zelfde bord, maar de library print nu zelf wat ze doet (verbinden, headers,
; TLS). Gebruik dit alleen om een verbindingsprobleem uit te zoeken:
;   pio run -e poe2-debug -t upload && pio device monitor
;
; -include dwingt ws_debug.h af vóór elk bronbestand, ook in de library zelf --
; een #define in de sketch bereikt die vertaaleenheid namelijk niet. Let op:
; DEBUG_WEBSOCKETS rechtstreeks als -D meegeven werkt niet, want de haakjes in
; "-DDEBUG_WEBSOCKETS(...)=..." overleven de shell niet.
[env:poe2-debug]
board = esp32-poe
build_flags = -include ${platformio.src_dir}/ws_debug.h

; --- Olimex ESP32-POE-ISO ---
[env:olimex]
board = esp32-poe-iso

; --- WT32-ETH01 ---
[env:wt32-eth01]
board = wt32-eth01
