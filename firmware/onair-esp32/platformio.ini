; ============================================================================
; PlatformIO-configuratie voor de On-Air Lamp ESP32-firmware
; ============================================================================
;
; Bouwen/uploaden:
;   pio run -e poe2 -t upload          ; Olimex ESP32-POE2 (standaard)
;   pio run -e olimex -t upload        ; Olimex ESP32-POE-ISO
;   pio run -e wt32-eth01 -t upload    ; WT32-ETH01
; Seriele monitor:
;   pio device monitor
;
; LET OP: zet in config.h ook de juiste BOARD-macro, zodat de firmware de
; bijbehorende Ethernet-pinnen en lamp-GPIO gebruikt.
; ----------------------------------------------------------------------------

[platformio]
; Het eerste env is de standaard wanneer je 'pio run' zonder -e draait.
default_envs = poe2

; Gedeelde instellingen voor beide borden.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson@^7

; --- Olimex ESP32-POE2 (standaard) ---
; PlatformIO heeft (nog) geen aparte 'esp32-poe2'-definitie; de POE2 gebruikt
; dezelfde klassieke ESP32 en is hiermee prima te bouwen en te flashen.
[env:poe2]
board = esp32-poe

; --- Olimex ESP32-POE-ISO ---
[env:olimex]
board = esp32-poe-iso

; --- WT32-ETH01 ---
[env:wt32-eth01]
board = wt32-eth01
